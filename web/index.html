<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Akari</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #bubble {
    position: fixed; left: 10px; right: 10px; bottom: 12px; padding: 10px 14px; border-radius: 18px;
    background: rgba(255, 255, 255, .93); color: #2b2233; box-shadow: 0 4px 18px rgba(0, 0, 0, .28);
    font: 600 15px/1.35 system-ui, sans-serif; opacity: 0; transform: translateY(6px);
    transition: opacity .25s, transform .25s; pointer-events: none;
  }
  #bubble.show { opacity: 1; transform: none; }
  #you { font-weight: 400; font-size: 12px; color: #8a7a99; margin-bottom: 4px; }
  #you:empty { display: none; }
  #status {
    position: fixed; top: 8px; right: 10px; padding: 3px 10px; border-radius: 999px; font: 600 12px system-ui, sans-serif;
    background: rgba(255, 143, 184, .92); color: #fff; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #status.show { opacity: 1; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="status"></div>
<div id="bubble"><div id="you"></div><div id="her"></div></div>
<script type="module" src="/app.js"></script>
</body>
</html>
